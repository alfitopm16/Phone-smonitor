name: Build APK & Inspect Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Inspect
        run: |
          unzip -o phonelink-monitor.zip
          echo "=== DAFTAR FILE DALAM PROYEK ==="
          ls -la
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Check and Build Android (if Gradle exists)
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Bukan proyek Android native (Gradle tidak ditemukan)."
          fi

      - name: Upload APK (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
